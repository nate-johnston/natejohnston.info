# site config
# vim: nospell
baseURL: https://natejohnston.info
title: Nate
assetDir: static

theme: hugo-eureka

paginate: 3
copyright: >
  &copy; 2023 Nate Johnston
enableEmoji: true
enableGitInfo: true
summaryLength: 75

defaultContentLanguage: en
hasCJKLanguage: false # Set `true` for Chinese/Japanese/Korean.
defaultContentLanguageInSubdir: false

# Uncomment for google analytics
# googleAnalytics: UA-123-45

markup:
  # Do not modify markup.highlight
  highlight:
    codeFences: false
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 6
    ordered: false
  goldmark:
    renderer:
      unsafe: true

taxonomies:
  category: categories
  tag: tags
  series: series
#  author: authors

build:
  useResourceCacheWhen: fallback

caches:
  images:
    dir: :cacheDir/images
